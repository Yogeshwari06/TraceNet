name: tracenet
description: "Hybrid Emergency Communication and Community Safety Platform"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0

   # Firebase
  firebase_core: ^3.14.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  firebase_messaging: ^15.1.0

 # Maps - OpenStreetMap
  flutter_map: ^8.2.2 
  latlong2: ^0.9.1

  # Location Services
  geolocator: ^10.1.0

  # Offline Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Connectivity
  connectivity_plus: ^7.3.0

  # Bluetooth
  flutter_blue_plus: ^1.35.0

  # HTTP Requests
  http: ^1.1.0
  dio: ^5.3.0

  # Date/Time
  intl: ^0.19.0

  # Notifications
  flutter_local_notifications: ^19.0.0

  # UI Components
  cupertino_icons: ^1.0.2
  animations: ^2.0.0
  flutter_animate: ^4.1.0

  # Utility
  uuid: ^4.0.0
  shared_preferences: ^2.2.0
  get_it: ^7.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/animations/

